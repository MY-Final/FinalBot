name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Build server and embedded Web UI
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Debian Bun image
        run: docker build --tag finalbot:ci .

      - name: Start with a persistent /data volume
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name finalbot-ci \
            --publish 18787:8787 \
            --env FINALBOT_ADMIN_TOKEN=ci-token \
            --env FINALBOT_FAKE_AGENT=1 \
            --volume finalbot-ci-data:/data \
            finalbot:ci
          for attempt in {1..60}; do
            if curl --fail --silent \
              --header "Authorization: Bearer ci-token" \
              http://127.0.0.1:18787/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs finalbot-ci || true

      - name: Remove container and volume
        if: always()
        run: |
          docker rm --force finalbot-ci || true
          docker volume rm finalbot-ci-data || true
